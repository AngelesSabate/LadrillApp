<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LadrillApp</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <header>
            <img src="img/logo3.png" alt="logo ladrillapp">
            <div class="header-derecha">
                <a class="active" href="#formObra">Crear Obra</a>
                <a href="#seccionElemento">Agregar Elemento</a>
                <a href="#listaElementos">Elementos de Obra</a>
                <a href="#totalesObra">Totales</a>
            </div>
    </header>

    <main>
        
        <section>
            <h2>Nueva obra</h2>

            <form id="formObra">

                <label for="nombreObra">Nombre de la obra</label>

                <input
                    type="text"
                    id="nombreObra"
                    required
                >

                <label for="descripcionObra">Descripción</label>

                <input
                    type="text"
                    id="descripcionObra"
                >

                <button type="submit">Crear obra</button>

            </form>

            <section id="seccionMisObras">

                <h2>Mis obras</h2>

                <div class="listaObras">
                    <select id="selectObras">
                        <option value="">Seleccione una obra</option>
                    </select>

                    <button type="button" id="botonAbrirObra">Abrir</button>
                    <button type="button" id="botonEliminarObra">Eliminar</button>
                </div>

            </section>

            <!-- nombre obra creada -->
            <p id="mensajeObra"></p>

        </section>

        <section id="seccionElemento">

            <h2>Agregar elemento constructivo</h2>

            <form id="formElemento">

                <label for="tipoConstructivo">Tipo constructivo</label>
                <select id="tipoConstructivo" required></select>

                <label for="nombreElemento">Nombre del elemento</label>
                <input
                    type="text"
                    id="nombreElemento"
                    placeholder="Ej: Pared dormitorio"
                >

                <label for="largo">Largo (m)</label>
                <input
                    type="number"
                    id="largo"
                    step="0.01"
                    min="0"
                    required
                >

                <label id="labelSegundaDimension" for="segundaDimension">Alto (m)</label>
                <input
                    type="number"
                    id="segundaDimension"
                    step="0.01"
                    min="0"
                    required
                >

                <button type="submit">Calcular y agregar</button>

            </form>

        </section>

        <section id="seccionListaElementos">

            <h2>Elementos de la obra</h2>

            <div id="listaElementos">
                Todavía no hay elementos cargados.
            </div>

        </section>

        <section id="totalesObra">
            <h2>Totales de la obra</h2>
            <div id="contenidoTotales"></div>
            <button type="button" id="botonDescargarTxt">Descargar resumen TXT</button>

        </section>
        
    </main>

    <footer>
        <p>Hecho con: HTML, CSS, JS, NODE, MYSQL</p>

    </footer>
</body>
    

    <script src="app.js"></script>
</html>
